apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "3"
    openshift.io/display-name: facebook-sub
  name: facebook-sub
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: facebook-opt-125m
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 2000
      window: 1m
  organization:
    id: f58e03dd-efb0-4cfe-a345-bce0f3044bc9
  owner:
    groups:
    - name: f58e03dd-efb0-4cfe-a345-bce0f3044bc9/ai-grid-users
