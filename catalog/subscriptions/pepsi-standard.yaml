apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
    maas.opendatahub.io/retain-api-keys-on-delete: "true"
    openshift.io/display-name: pepsi-standard
  name: pepsi-standard
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: acme-smollm2
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 1000
